<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Aangan by Gokarma Living</title>
  <meta name="description" content="Photos of Aangan by Gokarma Living — the dorms, the Vintage Room, the forest paths, and the hand-painted sign that started it all.">
  <link rel="canonical" href="https://aangangokarma.example.com/gallery.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body data-page="gallery">

  <div id="site-header"></div>

  <section class="section">
    <div class="container text-center">
      <span class="section-eyebrow">A Closer Look</span>
      <h1>Gallery</h1>
      <p class="section-subtitle">Click any photo to view it larger.</p>
    </div>
  </section>

  <section class="section alt-bg">
    <div class="container">
      <div id="galleryGrid" class="auto-grid" style="--grid-min: 220px;"></div>
    </div>
  </section>

  <!-- Lightbox overlay: hidden by default, opened by js/gallery.js -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lightboxClose" class="lightbox-close" aria-label="Close">✕</button>
    <button id="lightboxPrev" class="lightbox-prev" aria-label="Previous photo">‹</button>
    <img id="lightboxImage" src="" alt="" />
    <button id="lightboxNext" class="lightbox-next" aria-label="Next photo">›</button>
  </div>

  <div id="site-footer"></div>

  <script src="js/utils.js"></script>
  <script src="js/data/gallery-data.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
