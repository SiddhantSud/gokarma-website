# ============================================================
# What the /admin console can edit, and how.
#
# Every save becomes a draft (a pull request on GitHub). Pressing
# "Publish" in the console merges it, and the site rebuilds in
# about 2-3 minutes. Nothing goes live until someone publishes.
#
# Photo fields store paths like "images/rooms/4-bed-dorm-1.jpg",
# meaning src/assets/images/rooms/4-bed-dorm-1.jpg. Astro makes the
# resized copies (and removes GPS data) when the site builds.
# ============================================================

backend:
  name: github
  repo: SiddhantSud/gokarma-website
  branch: master
  auth_methods: [token]
  commit_messages:
    create: 'Add {{collection}} "{{slug}}" (via /admin)'
    update: 'Update {{collection}} "{{slug}}" (via /admin)'
    delete: 'Delete {{collection}} "{{slug}}" (via /admin)'
    uploadMedia: 'Upload photo "{{path}}" (via /admin)'
    deleteMedia: 'Delete photo "{{path}}" (via /admin)'

publish_mode:
  type: editorial_workflow
  stages: [draft, pending_publish]

site_url: https://siddhantsud.github.io/gokarma-website/
display_url: https://siddhantsud.github.io/gokarma-website/

media_folder: src/assets/images/uploads
public_folder: images/uploads

collections:
  # ---- Gokarna Guide articles ----
  - name: guide
    label: Gokarna Guide articles
    label_singular: article
    description: >-
      Articles on the Gokarna Guide page. Stories sent in by guests go here too:
      put their name in "Author".
    folder: src/content/guide
    create: true
    slug: 'guide-{{slug}}'
    sortable_fields: [order, date, title]
    media_folder: /src/assets/images/guide
    public_folder: images/guide
    fields:
      - { name: title, label: Title, widget: string }
      - name: tag
        label: Label above the title
        widget: string
        hint: e.g. Solo Travel, Food, Treks
      - { name: subtitle, label: Line under the title, widget: string, required: false }
      - name: author
        label: Author
        widget: string
        required: false
        hint: Leave empty for articles by Aangan
      - { name: image, label: Main photo, widget: image }
      - name: imageAlt
        label: Describe the main photo
        widget: string
        hint: For people using screen readers, and for Google
      - { name: excerpt, label: Short summary for the card, widget: text }
      - name: description
        label: Google description
        widget: text
        hint: One or two sentences shown in search results
      - name: date
        label: Date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - name: order
        label: Position in the list
        widget: number
        value_type: int
        default: 100
        hint: Lower numbers come first
      - { name: ctaTitle, label: Stay-with-us box title, widget: string, required: false }
      - { name: ctaText, label: Stay-with-us box text, widget: string, required: false }
      - { name: draft, label: Hide from the site, widget: boolean, default: false }
      - { name: body, label: Article, widget: markdown }

  # ---- Photos around the site ----
  - name: photos
    label: Photos
    description: Photo lists used across the site. Upload new photos from any photo field.
    files:
      - name: gallery
        label: Gallery page
        file: src/data/gallery.json
        description: The first 4 photos also appear on the Home page, so lead with the best.
        fields:
          - name: photos
            label: Photos
            widget: list
            summary: '{{caption}}'
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Describe the photo, widget: string }
              - { name: caption, label: Caption, widget: string }
      - name: vibe
        label: Home photo strip (The Vibe)
        file: src/data/vibe.json
        fields:
          - name: cards
            label: Cards
            widget: list
            summary: '{{label}}'
            fields:
              - { name: label, label: Label on the photo, widget: string }
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Describe the photo, widget: string }
      - name: places
        label: Walkable places (Home)
        file: src/data/nearby.json
        fields:
          - name: places
            label: Places
            widget: list
            summary: '{{name}} · {{walk}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: One line about it, widget: string }
              - name: walk
                label: Walking time
                widget: string
                hint: e.g. 10 min walk
              - name: icon
                label: Icon (shown when there is no photo)
                widget: select
                options: [beach, temple, sunset, cave]
              - { name: image, label: Photo, widget: image, required: false }
              - { name: alt, label: Describe the photo, widget: string, required: false }
              - name: credit
                label: Photo credit (only for photos that are not ours)
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: author, label: Photographer, widget: string }
                  - { name: license, label: Licence, widget: string }
                  - { name: licenseUrl, label: Licence link, widget: string }
                  - { name: source, label: Where the photo came from, widget: string }
              - name: link
                label: Link to a Guide article
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: href, label: 'Page, e.g. guide-x.html#section', widget: string }
                  - { name: label, label: Link text, widget: string }
      - name: rooms
        label: Rooms
        file: src/data/rooms.json
        fields:
          - name: rooms
            label: Rooms
            widget: list
            summary: '{{name}}'
            fields:
              - name: id
                label: ID
                widget: string
                hint: Used in booking links. Don't change it for existing rooms.
              - { name: name, label: Name, widget: string }
              - { name: badge, label: Ribbon, widget: string, required: false }
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Describe the photo, widget: string }
              - { name: features, label: Features, widget: list }

  # ---- Words and numbers ----
  - name: details
    label: Details
    files:
      - name: facts
        label: Rating, price and contact
        file: src/data/facts.json
        description: Shown on several pages. Every value must be real.
        fields:
          - name: rating
            label: Google rating
            widget: string
            hint: From the Google listing, e.g. 4.9
          - { name: reviewCount, label: Number of Google reviews, widget: number, value_type: int }
          - {
              name: dormPriceFrom,
              label: Dorm beds from (₹ per night),
              widget: number,
              value_type: int,
            }
          - { name: phoneDisplay, label: Phone (as shown), widget: string }
          - { name: phoneLink, label: Phone (+91 and digits), widget: string }
          - { name: whatsappNumber, label: WhatsApp number (91 and digits only), widget: string }
          - { name: instagramUrl, label: Instagram link, widget: string }
          - name: submissionsEmail
            label: Email for guest story submissions
            widget: string
            required: false
            hint: Leave empty to receive stories on WhatsApp
      - name: travel
        label: Travel tips (auto ride)
        file: src/data/travel-tips.json
        description: Shown in How to reach us on the Home page. Empty fields stay hidden.
        fields:
          - {
              name: sayToDriver,
              label: What to tell the auto driver,
              widget: string,
              required: false,
            }
          - name: fareFromBusStand
            label: Usual auto fare from the bus stand
            widget: string
            required: false
            hint: e.g. ₹150–200
          - name: fareFromStation
            label: Usual auto fare from Gokarna Road station
            widget: string
            required: false
      - name: reviews
        label: Guest quotes (Stories We Have Lived)
        file: src/data/reviews.json
        description: Copy quotes word for word from real reviews. Never write or reword them.
        fields:
          - name: reviews
            label: Quotes
            widget: list
            summary: '{{name}} · {{source}}'
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: Guest name, widget: string }
              - name: source
                label: Where it is from
                widget: select
                options: [Google, Booking.com, Hostelworld]
