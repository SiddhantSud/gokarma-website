# ============================================================
# Builds the site with Astro and publishes it to GitHub Pages.
#
# - Every pull request: code checks (formatting, lint, type
#   check) and a build, to make sure nothing is broken. Nothing
#   is published.
# - Every merge to master: build, then publish to
#   https://siddhantsud.github.io/gokarma-website/
#   (live about 2-3 minutes after the merge).
# - "Run workflow" on the Actions tab re-publishes by hand.
#
# If a build fails, nothing is published and the current site
# stays up.
# ============================================================
name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer merge replaces a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same checks as `npm run verify` locally, minus the build
  # (the build job below does that).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (astro check)
        run: npm run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with Astro
        uses: withastro/action@v6.1.3
        with:
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
