# ============================================================
# Builds the site with Astro and publishes it to GitHub Pages.
#
# - Every pull request: build only, as a check that nothing is
#   broken. Nothing is published.
# - Every merge to master: build, then publish to
#   https://siddhantsud.github.io/gokarma-website/
#   (live about 2-3 minutes after the merge).
# - "Run workflow" on the Actions tab re-publishes by hand.
#
# If a build fails, nothing is published and the current site
# stays up.
# ============================================================
name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer merge replaces a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with Astro
        uses: withastro/action@v6.1.3
        with:
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
